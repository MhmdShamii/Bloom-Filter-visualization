<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js prob solving</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <section class="section bloom">
        <h3>Bloom Filter</h3>
        <p>Enter User Name</p>
        <input class="bloom-input" type="text" placeholder="Username" />
        <div class="bloom-result">
            <input type="checkbox" id="checkbox" class="bloom-toggle" checked />
            <label for="checkbox">turn On debounce and bloom filter</label>
        </div>
    </section>

    <section class="section bloom-result">
        <h3>Bloom Filter Result</h3>
        <div class="Hashes">
            <div class="hash">
                <p>Hash 1</p>
                <p class="hash-output-1">0</p>
            </div>
            <div class="hash">
                <p>Hash 2</p>
                <p class="hash-output-2">0</p>
            </div>
            <div class="hash">
                <p>Hash 3</p>
                <p class="hash-output-3">0</p>
            </div>
        </div>
        <div class="bits">
        </div>
    </section>

    <section class="section server-data">
        <h3>Check Username exists Requests</h3>
        <p class="count">0</p>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
