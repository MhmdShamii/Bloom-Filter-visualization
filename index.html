<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js prob solving</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <section class="section bloom">
        <h3>Bloom Filter</h3>
        <p>Enter User Name</p>
        <div class="register-container">
            <input class="bloom-input" type="text" placeholder="Username" />
            <button class="register">Register Username</button>
        </div>
        <div class="bloom-result">
            <input type="checkbox" id="checkbox" class="bloom-toggle" checked />
            <label for="checkbox">turn On debounce and bloom filter</label>
        </div>
    </section>

    <section class="section bloom-result">
        <h3>Bloom Filter Result</h3>
        <div class="Hashes">
            <div class="hash">
                <p>Hash 1</p>
                <p class="hash-output-1">0</p>
            </div>
            <div class="hash">
                <p>Hash 2</p>
                <p class="hash-output-2">0</p>
            </div>
            <div class="hash">
                <p>Hash 3</p>
                <p class="hash-output-3">0</p>
            </div>
        </div>
        <div class="bits">
        </div>
    </section>

    <section class="section server-data">
        <div class="stat">
            <h3>Server Requests</h3>
            <p class="count requests-count">0</p>
        </div>
        <div class="stat">
            <h3>Skipped By Bloom Filter</h3>
            <p class="count skipped-count">0</p>
        </div>
        <div class="stat">
            <h3>False Positives</h3>
            <p class="count false-positive-count">0</p>
        </div>
    </section>

    <section class="section table-section">
        <table class="users-table">
            <tr>
                <td>id</td>
                <td>username</td>
            </tr>
        </table>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
